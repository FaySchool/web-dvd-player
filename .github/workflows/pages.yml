name: Deploy to GitHub Pages

# Publishes the static site in site/ (including the prebuilt VLC WebAssembly
# engine in site/vlc/). Enable it in the repository settings:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the VLC engine is present
        run: |
          for f in dvdplayer.js dvdplayer.wasm dvdplayer.worker.js \
                   modules/audio_output/webaudio/audio-worklet-processor.js; do
            if [ ! -f "site/vlc/$f" ]; then
              echo "::error::site/vlc/$f is missing. Run the 'Build VLC WebAssembly' workflow (or build/build.sh) first."
              exit 1
            fi
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
